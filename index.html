<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نسيم · نظام إدارة الفروع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EE; --surface:#FFFFFF; --surface-2:#F6F8F6;
  --ink:#16211D; --ink-soft:#5A6864; --line:#E1E7E3;
  --emerald:#0F5C46; --emerald-deep:#0B4536; --emerald-tint:#E7F1EC;
  --honey:#C98A2B; --honey-tint:#FBF1DF;
  --danger:#B4413A; --danger-tint:#FBEAE8;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(11,69,54,.04),0 8px 24px rgba(11,69,54,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Cairo',sans-serif;font-weight:800;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
::placeholder{color:#9AA8A2}
.hidden{display:none!important}

/* بوابة */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(120% 90% at 100% 0%,#12503F0d 0%,transparent 55%),radial-gradient(90% 80% at 0% 100%,#C98A2B10 0%,transparent 50%),var(--bg)}
.gate-card{width:100%;max-width:430px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:38px 32px;box-shadow:var(--shadow);text-align:center}
.brand-mark{width:64px;height:64px;margin:0 auto 18px;border-radius:20px;background:linear-gradient(150deg,var(--emerald),var(--emerald-deep));display:grid;place-items:center;color:#fff;font-family:'Cairo';font-weight:800;font-size:30px;box-shadow:0 10px 24px rgba(11,69,54,.28)}
.gate-card h1{font-size:25px;margin-bottom:2px}
.gate-sub{color:var(--ink-soft);margin-bottom:26px;font-size:14px}
.role-btn{width:100%;display:flex;align-items:center;gap:14px;text-align:right;padding:16px 18px;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--surface-2);margin-bottom:12px;transition:.15s}
.role-btn:hover{border-color:var(--emerald);background:var(--emerald-tint);transform:translateY(-1px)}
.role-btn .ic{font-size:22px}
.role-btn b{display:block;font-family:'Cairo';font-size:16px}
.role-btn span{font-size:12.5px;color:var(--ink-soft)}
.gate .field{text-align:right;margin-bottom:14px}
.gate .field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.gate .field input,.gate .field select{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2)}
.pin-input{text-align:center;letter-spacing:6px;font-size:20px!important}
.gate-back{margin-top:12px;background:none;border:none;color:var(--ink-soft);font-size:13px;text-decoration:underline}
.gate-err{color:var(--danger);font-size:13px;margin:8px 0;min-height:18px}

/* هيكل */
.app{display:none;min-height:100vh}
.app.show{display:grid;grid-template-columns:236px 1fr}
.side{background:var(--emerald-deep);color:#DCEAE3;padding:20px 14px;display:flex;flex-direction:column;gap:5px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.side .logo .m{width:38px;height:38px;border-radius:12px;background:#ffffff14;display:grid;place-items:center;font-family:'Cairo';font-weight:800;color:#fff;font-size:18px}
.side .logo b{font-family:'Cairo';color:#fff;font-size:16px;line-height:1.2}
.side .logo span{font-size:10.5px;color:#8FB6A6;display:block}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:#B9D2C7;font-weight:500;font-size:14px;transition:.14s;border:none;background:none;width:100%;text-align:right}
.nav-item .ic{font-size:16px;width:20px;text-align:center}
.nav-item:hover{background:#ffffff10;color:#fff}
.nav-item.active{background:var(--honey);color:#3a2708;font-weight:700}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid #ffffff1a}
.side-ctx{font-size:11.5px;color:#8FB6A6;padding:4px 8px 10px;line-height:1.7}
.side-ctx b{color:#DCEAE3}
.logout{color:#9FBEB1;font-size:13px;background:none;border:none;display:flex;gap:8px;align-items:center;padding:8px}
.logout:hover{color:#fff}

.main{padding:24px 28px 60px;max-width:1180px;width:100%}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:16px;flex-wrap:wrap}
.topbar h2{font-size:23px}
.topbar .date{color:var(--ink-soft);font-size:13px;margin-top:2px}
.chip{background:var(--emerald-tint);color:var(--emerald);padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:700}
.mode-banner{background:var(--honey-tint);color:#7a5411;border:1px solid #E7CD9A;border-radius:10px;padding:9px 14px;font-size:12.5px;margin-bottom:18px;display:flex;gap:8px;align-items:center}

/* بطاقات وحقول */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card+.card{margin-top:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.card-h h3{font-size:17px}
.card-h .hint{font-size:12.5px;color:var(--ink-soft);font-weight:400}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:repeat(3,1fr)}.grid-4{grid-template-columns:repeat(4,1fr)}

.field{margin-bottom:13px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field .req{color:var(--danger)}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);transition:.14s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--emerald);background:#fff}
.field .fixed{background:var(--emerald-tint);color:var(--emerald);font-weight:700;border-color:transparent}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row .field{flex:1;min-width:140px}

.btn{background:var(--emerald);color:#fff;border:none;padding:11px 20px;border-radius:var(--radius-sm);font-weight:700;font-size:14.5px;transition:.14s}
.btn:hover{background:var(--emerald-deep)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--emerald);background:var(--emerald-tint);color:var(--emerald)}
.btn.honey{background:var(--honey);color:#3a2708}.btn.honey:hover{background:#b3781f}
.btn.sm{padding:7px 13px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}

/* رفع الصور */
.filebox{border:1.5px dashed #C9A96B;border-radius:var(--radius-sm);padding:14px;text-align:center;background:var(--honey-tint);cursor:pointer;transition:.14s;position:relative}
.filebox:hover{border-color:var(--honey)}
.filebox input{position:absolute;inset:0;opacity:0;cursor:pointer}
.filebox .ic{font-size:22px}
.filebox small{display:block;color:#8a5e14;font-size:12px;margin-top:2px}
.filebox.done{border-style:solid;border-color:var(--emerald);background:var(--emerald-tint)}
.filebox.done small{color:var(--emerald)}
.thumb{width:46px;height:46px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;vertical-align:middle}

/* جداول */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
.tbl th{text-align:right;color:var(--ink-soft);font-weight:700;font-size:12px;padding:9px 11px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--surface-2)}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700}
.tag.ok{background:var(--emerald-tint);color:var(--emerald)}
.tag.warn{background:var(--honey-tint);color:#8a5e14}
.tag.bad{background:var(--danger-tint);color:var(--danger)}
.icon-btn{background:none;border:none;color:var(--ink-soft);font-size:15px;padding:4px 6px;border-radius:6px}
.icon-btn:hover{color:var(--danger);background:var(--danger-tint)}
.empty{text-align:center;color:var(--ink-soft);padding:32px 10px;font-size:14px}
.empty .ic{font-size:30px;display:block;margin-bottom:8px;opacity:.5}

/* kpi */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.kpi .lbl{color:var(--ink-soft);font-size:13px}
.kpi .v{font-family:'Cairo';font-weight:800;font-size:25px;margin-top:4px}
.kpi .sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
.hero{grid-column:1/-1;background:linear-gradient(135deg,var(--emerald),var(--emerald-deep));color:#fff;border:none}
.hero .lbl{color:#A9D0C1}
.hero .v{font-size:40px}
.hero .v small{font-size:18px;color:#BFE0D3}

/* شريط الفلترة */
.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:6px}
.filterbar .field{margin:0;min-width:130px}
.filterbar .field.grow{flex:1}

/* تشيك لست */
.check-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--radius-sm);margin-bottom:8px;background:var(--surface-2);transition:.14s}
.check-item.done{background:var(--emerald-tint);border-color:var(--emerald)}
.check-item .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--emerald);display:grid;place-items:center;color:#fff;font-weight:800;flex:0 0 auto}
.check-item.done .box{background:var(--emerald)}
.check-item .t{font-weight:700;flex:1}
.check-item .who{font-size:11.5px;color:var(--ink-soft)}

/* modal صورة */
.modal{position:fixed;inset:0;background:#000000d0;display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.show{display:flex}
.modal img{max-width:95%;max-height:92vh;border-radius:12px}
.modal .x{position:absolute;top:16px;left:16px;background:#ffffff22;color:#fff;border:none;width:40px;height:40px;border-radius:50%;font-size:20px}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:99px;font-size:14px;font-weight:500;opacity:0;transition:.25s;z-index:120;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.note-list{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.note-item{background:var(--surface-2);border-radius:9px;padding:8px 11px;font-size:13px;display:flex;justify-content:space-between;gap:10px}
.note-item span{color:var(--ink-soft);font-size:11px;white-space:nowrap}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--emerald);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

@media(max-width:860px){
  .app.show{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px;gap:6px}
  .side .logo{padding:4px 8px;width:100%}
  .side-foot,.side-ctx{width:100%;margin:0;border:none;padding:4px 8px}
  .nav-item{width:auto}
  .main{padding:18px 14px 50px}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- بوابة الدخول -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="brand-mark" id="brandMark">ن</div>
    <h1 id="gateTitle">نسيم</h1>

    <div id="rolePick">
      <button class="role-btn" onclick="pickEmployee()">
        <span class="ic">☕</span>
        <div><b>دخول الموظف</b><span>الإقفال · المشتريات · الجرد · التشيك لست</span></div>

<!-- التطبيق -->
<div class="app" id="app">

      <div class="m" id="sideMark">ن</div>
      <div><b id="sideName">نسيم</b><span>نظام إدارة الفروع</span></div>

  <main class="main">

      <div><h2 id="pageTitle">الرئيسية</h2><div class="date" id="todayDate"></div></div>
      <span class="chip" id="ctxChip"></span>
    </div>
    <div id="modeBanner" class="mode-banner hidden"></div>
    <div id="view"></div>
  </main>
</div>

<div class="modal" id="imgModal" onclick="this.classList.remove('show')"><button class="x">✕</button><img id="imgModalImg" src=""></div>
<div class="toast" id="toast"></div>

<script>
/* ═══════════ ① الإعدادات ═══════════ */
const CONFIG = {
  CAFE_NAME : 'نسيم',
  ADMIN_PIN : '9009',
  FIREBASE : {
    apiKey:'AIzaSyAEI8sYqve8I4xEBA98ouEnIfPbqJCff-I',
    authDomain:'naseem-cc4b6.firebaseapp.com',
    projectId:'naseem-cc4b6',
    storageBucket:'naseem-cc4b6.firebasestorage.app',
    messagingSenderId:'202554840320',
    appId:'1:202554840320:web:b6ce1c69ce56d92f7d0fe5'
  }
};

/* ═══════════ ② التخزين ═══════════ */
const USE_FB = !!CONFIG.FIREBASE.projectId;
const hasWinStore = (typeof window.storage==='object' && typeof window.storage.get==='function');
let db=null, _fbInit=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function initFirebase(){
  if(!USE_FB || db) return;
  await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
  await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
  firebase.initializeApp(CONFIG.FIREBASE); db=firebase.firestore();
}
async function ensureDB(){ if(!USE_FB) return; if(db) return; if(!_fbInit) _fbInit=initFirebase(); await _fbInit; }
const MEM={};
async function lget(col){
  if(MEM[col]) return MEM[col].map(x=>({...x}));
  const k='naseemB:'+col; let arr=[];
  try{
    if(hasWinStore){ const r=await window.storage.get(k,false); arr=r?JSON.parse(r.value):[]; }
    else{ const v=localStorage.getItem(k); arr=v?JSON.parse(v):[]; }
  }catch(e){ arr=[]; }
  MEM[col]=arr; return arr.map(x=>({...x}));
}
async function lset(col,arr){
  MEM[col]=arr.map(x=>({...x}));
  const k='naseemB:'+col, s=JSON.stringify(arr);
  try{ if(hasWinStore){ await window.storage.set(k,s,false); } else { localStorage.setItem(k,s); } }
  catch(e){ console.warn(e); toast('⚠️ تعذّر حفظ البيانات — الحجم كبير. يُنصح بتفعيل Firebase'); }
}
const Store={
  async all(col){
    if(USE_FB){ await ensureDB(); const snap=await db.collection(col).orderBy('_ts','desc').get(); return snap.docs.map(d=>({id:d.id,...d.data()})); }
    return (await lget(col)).sort((a,b)=>(b._ts||0)-(a._ts||0));
  },
  async add(col,obj){
    obj._ts=Date.now();
    if(USE_FB){ await ensureDB(); const r=await db.collection(col).add(obj); return r.id; }
    const arr=await lget(col); const id='l'+obj._ts+Math.floor(Math.random()*9999);
    arr.push({id,...obj}); await lset(col,arr); return id;
  },
  async update(col,id,patch){
    if(USE_FB){ await ensureDB(); await db.collection(col).doc(id).update(patch); return; }
    const arr=await lget(col); const i=arr.findIndex(x=>x.id===id);
    if(i>-1){ arr[i]={...arr[i],...patch}; await lset(col,arr); }
  },
  async remove(col,id){
    if(USE_FB){ await ensureDB(); await db.collection(col).doc(id).delete(); return; }
    let arr=await lget(col); arr=arr.filter(x=>x.id!==id); await lset(col,arr);
  }
};

/* ═══════════ ③ أدوات ═══════════ */
const $=s=>document.querySelector(s);
const money=n=>(Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:2});
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function nowParts(){const d=new Date();return{date:todayISO(),time:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};}
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00'); return d.toLocaleDateString('en-GB'); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }
function thisMonthYM(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function ymOf(r){ return (r.date||'').slice(0,7); }
function inThisMonth(r){ return ymOf(r)===thisMonthYM(); }
const MONTH_LABEL=ym=>{ const [y,m]=ym.split('-'); return new Date(y,m-1,1).toLocaleDateString('ar',{month:'long',year:'numeric'}); };
function openImg(src){ $('#imgModalImg').src=src; $('#imgModal').classList.add('show'); }

function compressImage(file,maxBytes=170000){
  return new Promise((res,rej)=>{
    const rd=new FileReader();
    rd.onload=()=>{ const img=new Image();
      img.onload=()=>{
        let dim=1000, q=.7;
        const render=()=>{ let w=img.width,h=img.height; const sc=Math.min(1,dim/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
          const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
          return c.toDataURL('image/jpeg',q); };
        let out=render(), guard=0;
        while(out.length>maxBytes*1.37 && guard++<14){ if(q>0.4) q-=0.1; else dim=Math.round(dim*0.85); out=render(); }
        res(out);
      };
      img.onerror=rej; img.src=rd.result; };
    rd.onerror=rej; rd.readAsDataURL(file);
  });
}
let XLSX_READY=false;
async function ensureXLSX(){ if(XLSX_READY&&window.XLSX) return; await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'); XLSX_READY=true; }
async function exportXLSX(rows,filename){
  if(!rows.length){ toast('لا توجد بيانات للتصدير'); return; }
  try{ await ensureXLSX(); const ws=XLSX.utils.json_to_sheet(rows); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'بيانات'); XLSX.writeFile(wb,filename); }
  catch(e){ toast('تعذّر تصدير Excel'); }
}
function exportPDF(title,headers,rows){
  const w=window.open('','_blank'); if(!w){ toast('اسمح بالنوافذ المنبثقة للطباعة'); return; }
  const th=headers.map(h=>`<th>${esc(h)}</th>`).join('');

async function saveStock(productId){
  const qty=parseFloat($('#inv_'+productId).value); if(isNaN(qty)||qty<0){ toast('اكتب كمية صحيحة'); return; }
  try{
    const stock=await Store.all('stock'); const ex=stock.find(s=>s.productId===productId && s.branch===BRANCH);
    const {date,time}=nowParts();
    if(ex) await Store.update('stock',ex.id,{qty,by:EMP_NAME,date,time});
    else await Store.add('stock',{productId,branch:BRANCH,qty,by:EMP_NAME,date,time});
    toast('تم تحديث الجرد ووصل للإدارة ✓');
  }catch(e){ toast('تعذّر الحفظ: '+(e&&e.message?e.message:'تحقّق من الإنترنت')); }
}

let _salesFilter={q:'',date:'',emp:'',branch:'',ym:thisMonthYM()};
RENDER.sales=async()=>{
  const closings=await Store.all('closings');
  const months=[...new Set(closings.map(ymOf).filter(Boolean))].sort().reverse();
  if(!months.includes(_salesFilter.ym)) _salesFilter.ym = months[0]||thisMonthYM();
  const emps=[...new Set(closings.map(c=>c.employee))];
  const branches=[...new Set(closings.map(c=>c.branch))];
  let rows=closings.filter(c=>ymOf(c)===_salesFilter.ym);
  if(_salesFilter.date) rows=rows.filter(c=>c.date===_salesFilter.date);
  if(_salesFilter.emp) rows=rows.filter(c=>c.employee===_salesFilter.emp);
  if(_salesFilter.branch) rows=rows.filter(c=>c.branch===_salesFilter.branch);
  if(_salesFilter.q){ const q=_salesFilter.q; rows=rows.filter(c=>(c.employee+c.branch+(c.notes||'')).includes(q)); }
  const total=rows.reduce((a,b)=>a+ +b.totalSales,0);
  window._salesRows=rows;
  $('#view').innerHTML=`
    <div class="card">
      <div class="card-h"><h3>الإقفالات</h3><span class="hint">${MONTH_LABEL(_salesFilter.ym)} · الإجمالي ${money(total)} ر.س · ${rows.length} إقفال</span></div>
      <div class="filterbar">
        <div class="field"><label>الشهر (أرشيف)</label><select onchange="_salesFilter.ym=this.value;RENDER.sales()">${months.length?months.map(m=>`<option value="${m}" ${m===_salesFilter.ym?'selected':''}>${MONTH_LABEL(m)}</option>`).join(''):`<option>${MONTH_LABEL(thisMonthYM())}</option>`}</select></div>
        <div class="field"><label>التاريخ</label><input type="date" value="${_salesFilter.date}" onchange="_salesFilter.date=this.value;RENDER.sales()"></div>
        <div class="field"><label>الموظف</label><select onchange="_salesFilter.emp=this.value;RENDER.sales()"><option value="">الكل</option>${emps.map(e=>`<option ${e===_salesFilter.emp?'selected':''}>${esc(e)}</option>`).join('')}</select></div>
        <div class="field"><label>الفرع</label><select onchange="_salesFilter.branch=this.value;RENDER.sales()"><option value="">الكل</option>${branches.map(b=>`<option ${b===_salesFilter.branch?'selected':''}>${esc(b)}</option>`).join('')}</select></div>
        <div class="field grow"><label>بحث</label><input placeholder="اسم/فرع/ملاحظة" value="${esc(_salesFilter.q)}" onchange="_salesFilter.q=this.value;RENDER.sales()"></div>
      </div>
      <div style="display:flex;gap:8px;margin:12px 0 4px">
        <button class="btn ghost sm" onclick="exportSalesXLSX()">⬇ Excel</button>
        <button class="btn ghost sm" onclick="exportSalesPDF()">🖨 PDF</button>
        ${(_salesFilter.date||_salesFilter.emp||_salesFilter.branch||_salesFilter.q)?`<button class="btn ghost sm" onclick="_salesFilter={q:'',date:'',emp:'',branch:'',ym:_salesFilter.ym};RENDER.sales()">مسح الفلترة</button>`:''}
      </div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>التاريخ</th><th>الوقت</th><th>الموظف</th><th>الفرع</th><th>المبيعات</th><th>الإقفال</th><th>كاش فعلي</th><th>كاش نظام</th><th>إلكتروني فعلي</th><th>إلكتروني نظام</th><th>فرق</th><th>الصور</th><th>ملاحظات</th><th></th></tr></thead>
        <tbody>${ rows.length? rows.map(r=>{
          const diff=(+r.physicalCash+ +r.ePayActual)-(+r.systemCash+ +r.ePaySystem);
          return `<tr>
            <td class="num">${fmtDate(r.date)}</td><td class="num">${esc(r.time)}</td>
            <td>${esc(r.employee)}</td><td>${esc(r.branch)}</td>
            <td class="num" style="font-weight:700">${money(r.totalSales)}</td><td class="num">${money(r.totalClosing)}</td>
            <td class="num">${money(r.physicalCash)}</td><td class="num">${money(r.systemCash)}</td>
            <td class="num">${money(r.ePayActual)}</td><td class="num">${money(r.ePaySystem)}</td>
            <td class="num">${diff===0?'<span class="tag ok">مطابق</span>':`<span class="tag ${Math.abs(diff)>0?'bad':'ok'}">${money(diff)}</span>`}</td>
            <td>${r.closingImg?`<img class="thumb" src="${r.closingImg}" onclick="openImg('${r.closingImg}')">`:''} ${r.reportImg?`<img class="thumb" src="${r.reportImg}" onclick="openImg('${r.reportImg}')">`:''}</td>
            <td>${esc(r.notes)||'—'}</td>
            <td><button class="icon-btn" onclick="del('closings','${r.id}','sales')">🗑</button></td>
          </tr>`; }).join('')
          : `<tr><td colspan="14"><div class="empty"><span class="ic">💰</span>لا توجد إقفالات بهذه الفلترة</div></td></tr>` }</tbody>
      </table></div>
    </div>`;
};
function salesExportRows(){ return (window._salesRows||[]).map(r=>({
  'التاريخ':fmtDate(r.date),'الوقت':r.time,'الموظف':r.employee,'الفرع':r.branch,
  'إجمالي المبيعات':r.totalSales,'إجمالي الإقفال':r.totalClosing,'كاش فعلي':r.physicalCash,'كاش نظام':r.systemCash,
  'إلكتروني فعلي':r.ePayActual,'إلكتروني نظام':r.ePaySystem,'ملاحظات':r.notes||'' })); }
function exportSalesXLSX(){ exportXLSX(salesExportRows(),`مبيعات-${_salesFilter.ym}.xlsx`); }
function exportSalesPDF(){
  const rows=(window._salesRows||[]).map(r=>[fmtDate(r.date),r.time,r.employee,r.branch,money(r.totalSales),money(r.totalClosing),money(r.physicalCash),money(r.systemCash),money(r.ePayActual),money(r.ePaySystem),r.notes||'']);
  exportPDF('تقرير المبيعات — '+MONTH_LABEL(_salesFilter.ym),['التاريخ','الوقت','الموظف','الفرع','المبيعات','الإقفال','كاش فعلي','كاش نظام','إلكتروني فعلي','إلكتروني نظام','ملاحظات'],rows);
}

/* الاستهلاك (المشتريات) */
let _consBranch='';
RENDER.consump=async()=>{
  const purchases=await Store.all('purchases');
  const branches=[...new Set(purchases.map(p=>p.branch))];
  let rows=purchases.filter(inThisMonth);
  if(_consBranch) rows=rows.filter(p=>p.branch===_consBranch);
  const monthTotal=rows.reduce((a,b)=>a+ (+b.qty*+b.price),0);
  const byProduct={};
  rows.forEach(p=>{ const k=p.product.trim(); if(!byProduct[k]) byProduct[k]={product:k,count:0,qty:0,total:0}; byProduct[k].count++; byProduct[k].qty+= +p.qty; byProduct[k].total+= +p.qty*+p.price; });
  const agg=Object.values(byProduct).sort((a,b)=>b.total-a.total);
  window._consAgg=agg;
  $('#view').innerHTML=`
    <div class="grid grid-2">
      <div class="kpi hero"><div class="lbl">إجمالي مشتريات ${MONTH_LABEL(thisMonthYM())}</div><div class="v num">${money(monthTotal)} <small>ر.س</small></div></div>
      <div class="kpi"><div class="lbl">عدد المنتجات المختلفة</div><div class="v num">${agg.length}</div><div class="sub">${rows.length} عملية شراء</div></div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="card-h"><h3>تصنيف المشتريات حسب المنتج</h3>
        <div style="display:flex;gap:8px;align-items:center">
          <select onchange="_consBranch=this.value;RENDER.consump()" style="padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface-2)"><option value="">كل الفروع</option>${branches.map(b=>`<option ${b===_consBranch?'selected':''}>${esc(b)}</option>`).join('')}</select>
          <button class="btn ghost sm" onclick="exportConsXLSX()">⬇ Excel</button>
          <button class="btn ghost sm" onclick="exportConsPDF()">🖨 PDF</button>
        </div>
      </div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>المنتج</th><th>عدد مرات الشراء</th><th>إجمالي الكمية</th><th>إجمالي الصرف (ر.س)</th></tr></thead>
      <tbody>${ agg.length? agg.map(a=>`<tr><td style="font-weight:700">${esc(a.product)}</td><td class="num">${a.count}</td><td class="num">${money(a.qty)}</td><td class="num" style="font-weight:700">${money(a.total)}</td></tr>`).join('')
        : `<tr><td colspan="4"><div class="empty"><span class="ic">🛒</span>لا مشتريات هذا الشهر</div></td></tr>` }</tbody></table></div>
    </div>
    <div class="card">
      <div class="card-h"><h3>تفاصيل العمليات</h3></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>التاريخ</th><th>المنتج</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th><th>الموظف</th><th>الفرع</th><th>المورّد</th><th>الحالة</th><th></th></tr></thead>
      <tbody>${ rows.length? rows.map(r=>`<tr><td class="num">${fmtDate(r.date)}</td><td>${esc(r.product)}</td><td class="num">${money(r.qty)}</td><td class="num">${money(r.price)}</td><td class="num" style="font-weight:700">${money(r.qty*r.price)}</td><td>${esc(r.employee)}</td><td>${esc(r.branch)}</td><td>${esc(r.supplier)||'—'}</td><td>${statusToggle(r)}</td><td><button class="icon-btn" onclick="del('purchases','${r.id}','consump')">🗑</button></td></tr>`).join('')
        : `<tr><td colspan="10"><div class="empty"><span class="ic">🧾</span>لا عمليات</div></td></tr>` }</tbody></table></div>
    </div>`;
};
function statusToggle(r){ const done=r.status&&r.status.includes('تمت'); return `<button class="tag ${done?'ok':'warn'}" style="border:none;cursor:pointer" onclick="togglePurchase('${r.id}','${done?0:1}')">${esc(r.status||'—')}</button>`; }
async function togglePurchase(id,to){ await Store.update('purchases',id,{status:to==='1'?'تمت المراجعة':'بانتظار المراجعة'}); RENDER.consump(); }
function exportConsXLSX(){ exportXLSX((window._consAgg||[]).map(a=>({'المنتج':a.product,'مرات الشراء':a.count,'إجمالي الكمية':a.qty,'إجمالي الصرف':a.total})),`استهلاك-${thisMonthYM()}.xlsx`); }
function exportConsPDF(){ exportPDF('تقرير الاستهلاك — '+MONTH_LABEL(thisMonthYM()),['المنتج','مرات الشراء','إجمالي الكمية','إجمالي الصرف'],(window._consAgg||[]).map(a=>[a.product,a.count,money(a.qty),money(a.total)])); }

/* الجرد (إدارة) */
RENDER.inventory=async()=>{
  const [products,stock,branches]=await Promise.all([Store.all('products'),Store.all('stock'),branchList()]);
  const rowsHtml=products.map(p=>{
    const perBranch=branches.map(b=>{ const st=stock.find(s=>s.productId===p.id&&s.branch===b); const q=st?st.qty:(p.init||0); const low=q<=(p.min||0);
      return `<span class="tag ${low?'bad':'ok'}" title="آخر تحديث ${st?esc(st.by||'')+' '+fmtDate(st.date):'—'}">${esc(b)}: ${money(q)}</span>`; }).join(' ');
    return `<tr><td style="font-weight:700">${esc(p.name)}</td><td>${esc(p.unit)||'—'}</td><td class="num">${money(p.min||0)}</td><td>${perBranch}</td><td><button class="icon-btn" onclick="del('products','${p.id}','inventory')">🗑</button></td></tr>`;
  }).join('');
  $('#view').innerHTML=`
    <div class="card">
      <div class="card-h"><h3>إضافة منتج للجرد</h3></div>
      <div class="row">
        <div class="field" style="flex:2"><label>اسم المنتج <span class="req">*</span></label><input id="pr_name" placeholder="مثال: حليب المراعي"></div>
        <div class="field"><label>الوحدة</label><input id="pr_unit" placeholder="حبة · كرتون · لتر · كيلو"></div>
        <div class="field"><label>الحد الأدنى</label><input type="number" id="pr_min" placeholder="0" min="0" step="any"></div>
        <div class="field"><label>الكمية الابتدائية</label><input type="number" id="pr_init" placeholder="0" min="0" step="any"></div>
      </div>
      <button class="btn" onclick="addProduct()">+ إضافة منتج</button>
    </div>
    <div class="card">
      <div class="card-h"><h3>منتجات الجرد</h3><span class="hint">الكمية معروضة لكل فرع</span></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>المنتج</th><th>الوحدة</th><th>الحد الأدنى</th><th>الكمية حسب الفرع</th><th></th></tr></thead>
      <tbody>${ products.length? rowsHtml : `<tr><td colspan="5"><div class="empty"><span class="ic">📦</span>ما فيه منتجات — أضف أول منتج</div></td></tr>` }</tbody></table></div>
    </div>`;
};
async function addProduct(){
  const name=$('#pr_name').value.trim(); if(!name){ toast('اكتب اسم المنتج'); return; }
  await Store.add('products',{name,unit:$('#pr_unit').value.trim(),min:parseFloat($('#pr_min').value)||0,init:parseFloat($('#pr_init').value)||0});
  toast('تمت إضافة المنتج ✓ (ظهر للموظفين)'); RENDER.inventory();
}

/* التشيك لست (إدارة) */
let _clDate=todayISO(), _clBranch='';
RENDER.checklist=async()=>{
  const [tasks,done,branches]=await Promise.all([Store.all('tasks'),Store.all('taskDone'),branchList()]);
  if(!_clBranch) _clBranch=branches[0];
  const dayDone=done.filter(d=>d.date===_clDate && d.branch===_clBranch);
  const list=tasks.map(t=>{
    const rec=dayDone.find(d=>d.taskId===t.id);
    return `<div class="check-item ${rec?'done':''}"><div class="box">${rec?'✓':''}</div>
      <div class="t">${esc(t.title)}</div>
      <div class="who">${rec?`✅ ${esc(rec.by)} · ${esc(rec.time)}`:'❌ لم تُنفّذ'}</div>
      <button class="icon-btn" onclick="del('tasks','${t.id}','checklist')">🗑</button></div>`;
  }).join('');
  const doneN=tasks.filter(t=>dayDone.some(d=>d.taskId===t.id)).length;
  $('#view').innerHTML=`
    <div class="card">
      <div class="card-h"><h3>إضافة مهمة</h3></div>
      <div class="row">
        <div class="field grow" style="flex:3"><label>المهمة <span class="req">*</span></label><input id="t_title" placeholder="مثال: تنظيف ماكينة الإسبريسو" onkeydown="if(event.key==='Enter')addTask()"></div>
        <div class="field" style="flex:0 0 auto;align-self:flex-end"><button class="btn" onclick="addTask()">+ إضافة</button></div>
      </div>
    </div>
    <div class="card">
      <div class="card-h"><h3>متابعة التنفيذ</h3><span class="hint">${doneN}/${tasks.length} منفّذة</span></div>
      <div class="filterbar" style="margin-bottom:12px">
        <div class="field"><label>الفرع</label><select onchange="_clBranch=this.value;RENDER.checklist()">${branches.map(b=>`<option ${b===_clBranch?'selected':''}>${esc(b)}</option>`).join('')}</select></div>
        <div class="field"><label>اليوم</label><input type="date" value="${_clDate}" onchange="_clDate=this.value;RENDER.checklist()"></div>
      </div>
      ${ tasks.length? list : `<div class="empty"><span class="ic">✅</span>ما فيه مهام — أضف أول مهمة</div>` }
    </div>`;
};
async function addTask(){ const t=$('#t_title').value.trim(); if(!t){ toast('اكتب المهمة'); return; } await Store.add('tasks',{title:t}); toast('تمت إضافة المهمة ✓ (ظهرت للموظفين)'); RENDER.checklist(); }

/* الفروع */
RENDER.branches=async()=>{
  const branches=await Store.all('branches');
  $('#view').innerHTML=`
    <div class="card">
      <div class="card-h"><h3>إضافة فرع</h3></div>
      <div class="row">
        <div class="field grow" style="flex:3"><label>اسم الفرع <span class="req">*</span></label><input id="b_name" placeholder="مثال: فرع قباء" onkeydown="if(event.key==='Enter')addBranch()"></div>
        <div class="field" style="flex:0 0 auto;align-self:flex-end"><button class="btn" onclick="addBranch()">+ إضافة</button></div>
      </div>
      ${!branches.length?'<p style="color:var(--ink-soft);font-size:13px">بدون فروع مضافة يعمل النظام بفرع واحد افتراضي (الفرع الرئيسي).</p>':''}
    </div>
    <div class="card">
      <div class="card-h"><h3>الفروع</h3><span class="hint">${branches.length} فرع</span></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>الفرع</th><th></th></tr></thead>
      <tbody>${ branches.length? branches.map(b=>`<tr><td style="font-weight:700">${esc(b.name)}</td><td><button class="icon-btn" onclick="del('branches','${b.id}','branches')">🗑</button></td></tr>`).join('')
        : `<tr><td colspan="2"><div class="empty"><span class="ic">🏬</span>ما فيه فروع مضافة</div></td></tr>` }</tbody></table></div>
    </div>`;
};
async function addBranch(){ const n=$('#b_name').value.trim(); if(!n){ toast('اكتب اسم الفرع'); return; } await Store.add('branches',{name:n}); toast('تمت إضافة الفرع ✓'); RENDER.branches(); }

/* الموظفون */
RENDER.staff=async()=>{
  const [staff,branches]=await Promise.all([Store.all('staff'),branchList()]);
  $('#view').innerHTML=`
    <div class="card">
      <div class="card-h"><h3>إضافة موظف</h3></div>
      <div class="row">
        <div class="field" style="flex:2"><label>اسم الموظف <span class="req">*</span></label><input id="st_name" placeholder="مثال: خالد العتيبي"></div>
        <div class="field"><label>الفرع</label><select id="st_branch">${branches.map(b=>`<option>${esc(b)}</option>`).join('')}</select></div>
        <div class="field"><label>المسمّى</label><input id="st_role" placeholder="باريستا · كاشير"></div>
      </div>
      <button class="btn" onclick="addStaff()">+ إضافة موظف</button>
    </div>
    ${ staff.length? staff.map(staffCard).join('') : `<div class="card"><div class="empty"><span class="ic">👥</span>ما فيه موظفين مسجّلين</div></div>` }`;
};
function staffCard(st){
  const notes=st.notes||[];
  return `<div class="card">
    <div class="card-h"><div><h3>${esc(st.name)}</h3><span class="hint">${esc(st.branch)||'—'} ${st.role?'· '+esc(st.role):''}</span></div>
      <button class="icon-btn" onclick="del('staff','${st.id}','staff')">🗑</button></div>
    <div class="row" style="align-items:flex-end">
      <div class="field grow" style="flex:3;margin:0"><label>إضافة ملاحظة</label><input id="note_${st.id}" placeholder="مثال: انضباط ممتاز · يحتاج تدريب" onkeydown="if(event.key==='Enter')addNote('${st.id}')"></div>
      <div class="field" style="flex:0 0 auto;margin:0"><button class="btn ghost" onclick="addNote('${st.id}')">حفظ</button></div>
    </div>
    ${ notes.length? `<div class="note-list">${notes.slice().reverse().map((n,i)=>`<div class="note-item"><div>${esc(n.text)}</div><span>${fmtDate(n.date)} <button class="icon-btn" onclick="delNote('${st.id}',${notes.length-1-i})">✕</button></span></div>`).join('')}</div>` : '' }
  </div>`;
}
async function addStaff(){ const name=$('#st_name').value.trim(); if(!name){ toast('اكتب اسم الموظف'); return; } await Store.add('staff',{name,branch:$('#st_branch').value,role:$('#st_role').value.trim(),notes:[]}); toast('تمت إضافة الموظف ✓'); RENDER.staff(); }
async function addNote(id){ const inp=$('#note_'+id); const text=inp.value.trim(); if(!text) return; const st=(await Store.all('staff')).find(x=>x.id===id); const notes=st.notes||[]; notes.push({text,date:todayISO()}); await Store.update('staff',id,{notes}); toast('تم حفظ الملاحظة ✓'); RENDER.staff(); }
async function delNote(id,idx){ const st=(await Store.all('staff')).find(x=>x.id===id); const notes=st.notes||[]; notes.splice(idx,1); await Store.update('staff',id,{notes}); RENDER.staff(); }

/* الأهداف */
RENDER.goals=async()=>{
  const goals=await Store.all('goals');
  $('#view').innerHTML=`
    <div class="card">
      <div class="card-h"><h3>إضافة هدف</h3></div>
      <div class="row">
        <div class="field" style="flex:2"><label>الهدف</label><input id="g_title" placeholder="مثال: افتتاح فرع ثاني"></div>
        <div class="field"><label>تاريخ مستهدف</label><input type="date" id="g_date"></div>
      </div>
      <div class="field"><label>تفاصيل (اختياري)</label><textarea id="g_note" rows="2" placeholder="الخطوات أو الملاحظات"></textarea></div>
      <button class="btn" onclick="addGoal()">إضافة الهدف</button>
    </div>
    <div class="card">
      <div class="card-h"><h3>قائمة الأهداف</h3><span class="hint">${goals.length} هدف</span></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>الهدف</th><th>التفاصيل</th><th>مستهدف</th><th>الحالة</th><th></th></tr></thead>
      <tbody>${ goals.length? goals.map(g=>`<tr><td style="font-weight:700">${esc(g.title)}</td><td style="color:var(--ink-soft);white-space:normal;max-width:240px">${esc(g.note)||'—'}</td><td class="num">${fmtDate(g.date)}</td>
        <td><select onchange="setGoal('${g.id}',this.value)" style="border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface-2)"><option value="pending" ${g.status==='pending'?'selected':''}>لم يبدأ</option><option value="prog" ${g.status==='prog'?'selected':''}>قيد التنفيذ</option><option value="done" ${g.status==='done'?'selected':''}>مكتمل</option></select></td>
        <td><button class="icon-btn" onclick="del('goals','${g.id}','goals')">🗑</button></td></tr>`).join('')
        : `<tr><td colspan="5"><div class="empty"><span class="ic">🎯</span>أضف أول هدف</div></td></tr>` }</tbody></table></div>
    </div>`;
};
async function addGoal(){ const title=$('#g_title').value.trim(); if(!title){ toast('اكتب الهدف'); return; } await Store.add('goals',{title,note:$('#g_note').value.trim(),date:$('#g_date').value,status:'pending'}); toast('تمت إضافة الهدف ✓'); RENDER.goals(); }
async function setGoal(id,status){ await Store.update('goals',id,{status}); toast('تم تحديث الحالة'); }

/* حذف عام */
async function del(col,id,page){ if(!confirm('متأكد من الحذف؟')) return; await Store.remove(col,id); toast('تم الحذف'); RENDER[page](); }
</script>
</body>
</html>
